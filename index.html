
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelligen | Welcome</title>
  <meta name="description" content="Welcome to Intelligen, where ideas meet intelligence.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f5f7ff;
    }
    header {
      padding: 24px 8%;
      border-bottom: 1px solid #293149;
      font-size: 1.4rem;
      font-weight: bold;
    }
    main {
      min-height: 75vh;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { font-size: clamp(2.5rem, 7vw, 5rem); margin-bottom: 16px; }
    p { color: #b7c1d9; line-height: 1.7; }
    a {
      display: inline-block;
      margin: 24px auto;
      padding: 14px 24px;
      background: #7188ff;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    footer { text-align: center; padding: 24px; color: #929db6; }
  </style>
</head>
<body>
  <header>Intelligen</header>
  <main>
    <div>
      <h1>Ideas meet intelligence.</h1>
      <p>Welcome to Intelligen.<br>
      We're building something meaningful. Stay tuned.</p>
      <a href="mailto:hello@example.com">Get in touch</a>
    </div>
  </main>
  <footer>&copy; 2026 Intelligen. All rights reserved.</footer>
</body>
</html>
